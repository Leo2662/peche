<!DOCTYPE html>
<html lang="fr">
  <head>
    <!-- Stays first: a charset declaration the parser finds after the first
         1024 bytes is one it ignores, and the tags below are 700 of them. -->
    <meta charset="utf-8" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VYBEV628Q0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-VYBEV628Q0');
    </script>

    <!-- Microsoft Clarity -->
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "xy5pox99ey");
    </script>

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />

    <title>Conditions de pêche au bar — BassScore</title>
    <meta
      name="description"
      content="Le score et les meilleurs créneaux de pêche au bar, en direct, pour votre spot."
    />
    <link rel="canonical" href="https://pecheaubar.fr/app/" />

    <!-- The landing page at / is what gets indexed. This is the tool itself:
         a client-rendered screen whose content is a number that changes hourly,
         with nothing for a crawler to read. -->
    <meta name="robots" content="noindex, follow" />

    <meta name="application-name" content="BassScore" />
    <meta name="theme-color" content="#030A12" />
    <meta name="color-scheme" content="dark" />
    <!-- The screen is full of times and scores; without this iOS turns
         "19:10 – 21:00" and three-digit numbers into phone links. -->
    <meta name="format-detection" content="telephone=no,date=no,address=no" />

    <meta property="og:title" content="BassScore" />
    <meta property="og:url" content="https://pecheaubar.fr/app/" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BassScore" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- The `react-native-web` recommended style reset:
         https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        /* Matches PALETTE.abyss, so there is no white flash before the JS loads. */
        background-color: #030a12;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      BassScore a besoin de JavaScript : le score est calculé sur votre appareil à
      partir des prévisions marines.
    </noscript>
    <div id="root"></div>
  </body>
</html>
